# 核心架构：频域平滑滤波 (FDAF) 护航 空间坐标对齐 (SCAU)
nc: 1
scales:
  m: [0.67, 0.75, 768]

backbone:
  # (Backbone 保持不变)
  - [-1, 1, Conv, [64, 3, 2]]         # 0
  - [-1, 1, Conv, [128, 3, 2]]        # 1
  - [-1, 3, C2f, [128, True]]         # 2
  - [-1, 1, Conv, [256, 3, 2]]        # 3
  - [-1, 6, C2f, [256, True]]         # 4
  - [-1, 1, Conv, [512, 3, 2]]        # 5
  - [-1, 6, C2f, [512, True]]         # 6
  - [-1, 1, Conv, [1024, 3, 2]]       # 7
  - [-1, 3, C2f, [1024, True]]        # 8
  - [-1, 1, SPPF, [1024, 5]]          # 9
  - [-1, 1, FDAF, []]                 # 10 🌟 骨干末端频域滤波 (替换原 DTAA)

head:
  # ----- P4 融合 -----
  - [-1, 1, SubPixelUpsample, []]     # 11
  - [[-1, 6], 1, Concat, [1]]         # 12 cat backbone P4
  - [-1, 1, FDAF, []]                 # 13 🌟 先通过 FDAF 洗掉高频碎石噪声
  - [-1, 1, CoordAttAlign, []]        # 14 ✅ SCAU 在纯净连贯的特征上轻松找边界
  - [-1, 3, C2f, [512, True]]         # 15 特征融合

  # ----- P3 融合 -----
  - [-1, 1, SubPixelUpsample, []]     # 16
  - [[-1, 4], 1, Concat, [1]]         # 17 cat backbone P3
  - [-1, 1, FDAF, []]                 # 18 🌟 频域滤波
  - [-1, 1, CoordAttAlign, []]        # 19 ✅ 边界对齐
  - [-1, 3, C2f, [256, True]]         # 20

  # ----- 下采样分支 (P4) -----
  - [-1, 1, Conv, [256, 3, 2]]        # 21
  - [[-1, 15], 1, Concat, [1]]        # 22 cat head P4
  - [-1, 1, FDAF, []]                 # 23 🌟 频域滤波
  - [-1, 1, CoordAttAlign, []]        # 24 ✅ 边界对齐
  - [-1, 3, C2f, [512, True]]         # 25

  # ----- 下采样分支 (P5) -----
  - [-1, 1, Conv, [512, 3, 2]]        # 26
  - [[-1, 10], 1, Concat, [1]]        # 27 cat backbone P5 (注意这里接的是 10)
  - [-1, 1, FDAF, []]                 # 28 🌟 频域滤波
  - [-1, 1, CoordAttAlign, []]        # 29 ✅ 边界对齐
  - [-1, 3, C2f, [1024, True]]        # 30

  # 分割头
  - [[20, 25, 30], 1, Segment, [nc, 32, 256]]   # 31